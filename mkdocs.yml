site_name: RL for tokamak current ramp-up
site_description: Literature review and CPU baselines for reinforcement learning on the Gym-TORAX ITER hybrid ramp-up benchmark
site_author: Leander Grech
site_url: https://leandergrech.github.io/rl-tokamak-rampup/
repo_url: https://github.com/leandergrech/rl-tokamak-rampup
repo_name: leandergrech/rl-tokamak-rampup
edit_uri: edit/main/docs/
exclude_docs: |
  upstream/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - For Leander: for-leander.md
  - 1. The control problem: 01-problem.md
  - 2. Domain primer:
      - Start here: 02-primer.md
      - 2.1 The machine: primer/1-machine.md
      - 2.2 The safety factor q: primer/2-safety-factor.md
      - 2.3 How the current gets in: primer/3-current-diffusion.md
      - 2.4 Heat, confinement and fusion: primer/4-heat-and-fusion.md
      - 2.5 Limits and the operating space: primer/5-limits.md
      - 2.6 From physics to reward: primer/6-reward.md
      - 2.7 The Ramp-up Lab: primer/7-lab.md
      - 2.8 Gaps, status and glossary: primer/8-field.md
      - Equation sheet: primer/equations.md
  - 3. Timeline 2018–2026: 03-timeline.md
  - 4. Designs and results: 04-designs.md
  - 5. Limitations: 05-limitations.md
  - 6. Open questions: 06-open-questions.md
  - 7. References: 07-references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/widgets.js
  - javascripts/tokamak-model.js
  - javascripts/lab.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
