name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # dev: the paper's stack (gymtorax 1.0.0 / TORAX 1.0.3); dev-physics: rl_tokamak.physics (gymtorax 1.1.1 / TORAX 1.4.3)
        extras: [dev, dev-physics]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch first (avoids the CUDA wheels)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Tests (each stack runs its own; the others are skipped)
        run: pytest -x
      - name: Docs build
        if: matrix.extras == 'dev'
        run: mkdocs build --strict
