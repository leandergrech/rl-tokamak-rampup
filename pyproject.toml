[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_tokamak"
version = "0.1.0"
description = "RL baselines and literature review for tokamak current ramp-up on Gym-TORAX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Leander Grech", email = "grechleander@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "gymnasium>=1.2,<2",
  "numpy>=2.0,<3",
  "torch>=2.2",
  "stable-baselines3>=2.4,<3",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# The simulator stack is an extra because the two environments need different, incompatible versions.
# Benchmark stack of the Gym-TORAX paper (arXiv 2510.11283, Table "expected return"); every result under data/runs.
paper = ["gymtorax==1.0.0", "torax==1.0.3", "jax==0.11.2", "jaxlib==0.11.2"]
# Current stack: TORAX's power-triggered pedestal (rl_tokamak.physics); every result under data/physics.
physics = ["gymtorax==1.1.1", "torax==1.4.3", "jax==0.11.2", "jaxlib==0.11.2"]
tools = [
  "pytest>=8",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "ipykernel>=6",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]
dev = ["rl_tokamak[paper,tools]"]
dev-physics = ["rl_tokamak[physics,tools]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rl_tokamak = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::pydantic.warnings.PydanticDeprecatedSince211",
  "ignore:You have specified a mini-batch size:UserWarning",
]
